# gitleaks config, used by the pre-commit hook and the CI secrets job.
# Default rules plus one custom rule. No global allowlist: a scan of the full
# history found nothing to exclude (.env.example holds names with empty values).
[extend]
useDefault = true

# Browser Use Cloud API keys. Their public docs say a key starts with "bu_"; they
# do not state a length, so the rule takes any token of 20 or more characters
# after the prefix and leans on the entropy check and the allowlist below to
# keep ordinary words out. It can still flag an identifier that starts with bu_
# and has digits or capitals (a variable or CSS class, say). To allow one, add its
# exact text to the allowlist below, for example '''^bu_my_identifier_v2$'''.
[[rules]]
id = "browser-use-api-key"
description = "Browser Use Cloud API key"
regex = '''\bbu_[A-Za-z0-9_-]{20,}'''
keywords = ["bu_"]
entropy = 3.0

  [[rules.allowlists]]
  description = "Placeholders, and plain lowercase names such as a snake_case identifier"
  regexes = [
    '''^bu_[a-z_]+$''',
    '''(?i)^bu_(your|example|sample|placeholder|dummy|fake|redacted)[a-z_]*$''',
    '''(?i)^bu_(x{4,}|0{4,})$''',
  ]
